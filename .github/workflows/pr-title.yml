name: Pull request convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-title:
    name: Validate pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ].*[^.]$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must match: type(optional-scope): imperative summary"
            echo "Allowed types: feat fix docs refactor perf test build ci chore revert"
            exit 1
          fi
